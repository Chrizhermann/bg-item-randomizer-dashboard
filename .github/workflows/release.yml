name: Release (latest)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder_flag: --win
          - os: macos-latest
            builder_flag: --mac
          - os: ubuntu-latest
            builder_flag: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Build platform artifact
        run: npx electron-builder ${{ matrix.builder_flag }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Delete old latest release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo ${{ github.repository }} || echo "no existing latest release"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Rolling alpha build from `main` @ ${{ github.sha }}.

            - Windows: portable `.exe` (no install)
            - macOS: `.dmg` (untested — please report issues)
            - Linux: `.AppImage` (untested — please report issues)

            Built: ${{ github.event.head_commit.timestamp }}
          files: artifacts/**/*
          make_latest: true
          prerelease: true
